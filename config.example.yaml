# FOX CYBER COMMAND v2.00 — example configuration
# Copy to config.yaml and edit. No real credentials belong here.

# SQLite database (default: foxcc.db next to foxcc.py)
database:
  path: "foxcc.db"
  # PostgreSQL is optional and NOT used by the core (SQLite only).
  # postgres:
  #   dsn: "postgresql://user:password@localhost:5432/foxcc"  # never commit real credentials

# Local-only API (binds 127.0.0.1 by default; never expose publicly)
api:
  host: "127.0.0.1"
  port: 8765
  # Token lives in .foxcc_api_token (0600), generated by the API module.
  # Never paste a token or password into this file.

# Lab network — localhost only. Never scan outside your scope.
lab:
  cidr: "127.0.0.0/8"

# Logging / audit
audit:
  enabled: true
  chain: "sha256"

# Updates: check-only, never auto-install, no network by default
updates:
  auto_install: false
  check_on_start: false
